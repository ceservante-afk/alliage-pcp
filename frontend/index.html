<style>.sync-dot.warn{background:#FBBF24}</style>
<script>
function openM(id){document.getElementById(id).classList.add('open');}
function closeM(id){document.getElementById(id).classList.remove('open');}
function applyOverrides(){
  Object.keys(_eov||{}).forEach(function(key){
    var p=key.split("||"),cod=p[0],ct=p[1],idx=parseInt(p[2]);
    var d=CTS[ct];if(!d)return;
    var g=null;
    for(var i=0;i<(d.grupos||[]).length;i++){if(d.grupos[i].c===cod){g=d.grupos[i];break;}}
    if(!g||!g.ops[idx])return;
    var v=_eov[key];
    g.ops[idx].i=v;g.ops[idx].cm=Math.round(v*g.q*100)/100;
    g.ct_total=0;for(var j=0;j<g.ops.length;j++)g.ct_total+=g.ops[j].cm;g.ct_total=Math.round(g.ct_total*100)/100;
    d.carga_min=0;for(var k=0;k<(d.grupos||[]).length;k++)d.carga_min+=(d.grupos[k].ct_total||0);
    d.carga_min=Math.round(d.carga_min*100)/100;d.carga_h=Math.round(d.carga_min/60*100)/100;
    d.carga_total_min=d.carga_min+(d.setup_min||0);d.carga_total_h=Math.round(d.carga_total_min/60*100)/100;
  });
  var cats=Object.keys(SETORES||{});
  for(var ci=0;ci<cats.length;ci++){
    var cat=cats[ci],s=SETORES[cat],sum=0;
    for(var ti=0;ti<s.cts.length;ti++){var c=CTS[s.cts[ti]];if(c)sum+=c.carga_total_h;}
    s.carga_h=Math.round(sum*100)/100;
  }
}
// Re-disparar loadData com funções corrigidas
window.addEventListener('load', function(){ if(typeof loadData==='function') loadData(); });
</script>
